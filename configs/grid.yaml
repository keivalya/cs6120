# configs/grid.yaml
# models x suites x conditions x seeds x n_episodes.  See CLAUDE.md §8.
# launch.py expands this into cells; each cell is idempotent/resumable.
#
# Budget rule (§2): SmolVLA gets the COMPLETE grid. 7B models get a reduced grid
# (Goal suite, fewer seeds, fewer episodes). Log which grid each model ran.

defaults:
  max_steps: 600

seeds: [7, 42, 123]

# All causal conditions are only valid on libero_goal / libero_10 (§0, §12).
# para_* conditions draw from the LIBERO-Para paraphrase suite (§3).
condition_sets:
  causal:        [original, blank, nonsense, wrong_object, wrong_action, wrong_task, repeated]
  paraphrase:    [para_object, para_action, para_compositional]

grids:
  smolvla:
    # FULL grid.
    suites: [libero_goal]            # + libero_10 for RQ1.4 (added in GATE 4 if budget allows)
    conditions: [original, blank, nonsense, wrong_object, wrong_action, wrong_task, repeated,
                 para_object, para_action, para_compositional]
    seeds: [7, 42, 123]
    n_episodes: 20

  openvla:
    # REDUCED grid.
    suites: [libero_goal]
    conditions: [original, blank, wrong_task, para_object, para_action]
    seeds: [7, 42]
    n_episodes: 10

  openvla_oft:
    suites: [libero_goal]
    conditions: [original, blank, wrong_task, para_object, para_action]
    seeds: [7, 42]
    n_episodes: 10

  openvla_oft_film:
    # only runs once hf_repo is confirmed in models.yaml (§12: missing > invented)
    suites: [libero_goal]
    conditions: [original, blank, wrong_task, para_object, para_action]
    seeds: [7, 42]
    n_episodes: 10
